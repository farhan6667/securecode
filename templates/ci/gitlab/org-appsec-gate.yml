# The gate comes from the central SecureCode repo at a pinned ref, never from the merge request.
# CI/CD variables (group level, protected): SECURECODE_URL (https clone URL), SECURECODE_REF (tag).
org_appsec_gate:
  image: python:3.12-slim
  stage: test
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    SEMGREP_SEND_METRICS: "off"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
    - git clone --depth 1 --branch "$SECURECODE_REF" "$SECURECODE_URL" /tmp/securecode
    - pip install "PyYAML==6.0.3"
    - bash /tmp/securecode/scripts/install-ci-scanners.sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - EXC="/tmp/securecode/exceptions/$(echo "$CI_PROJECT_PATH" | sed 's#/#__#g').yaml"
    - if [ -f "$EXC" ]; then export SECGATE_SUPPRESSIONS="$EXC"; fi
    - python -I /tmp/securecode/scripts/secgate.py . --mode ci --fail-on high --run-tests
  artifacts:
    when: always
    paths:
      - .security/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # avoid a second pipeline for a branch that already has an open merge request
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
