name: Org AI AppSec Gate
# The gate comes from the central SecureCode repo at a pinned ref, never from the pull request, and
# exceptions come from the security team's list there. For full enforcement, add this as an org-level
# "required workflow" ruleset so a pull request cannot edit or remove it (see ENTERPRISE_DEPLOYMENT.md).
# Org variables: SECURECODE_REPO (e.g. my-org/nexaforge-securecode), SECURECODE_REF (a tag or commit SHA).
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (tags can be rewritten; see the March 2026 Trivy incident).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the central gate (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.SECURECODE_REPO }}
          ref: ${{ vars.SECURECODE_REF }}
          path: .securecode
          persist-credentials: false
      - name: Move the gate out of the scanned folder
        # Scanners scan the whole workspace; the gate's own rule text and test fixtures must not be in it.
        run: mv .securecode "$RUNNER_TEMP/securecode"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned scanners (SHA-256 verified)
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          bash "$RUNNER_TEMP/securecode/scripts/install-ci-scanners.sh"
      - name: Run the gate (fails closed if a scanner is missing or errors)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          EXC="$RUNNER_TEMP/securecode/exceptions/${GITHUB_REPOSITORY//\//__}.yaml"
          if [ -f "$EXC" ]; then export SECGATE_SUPPRESSIONS="$EXC"; fi
          python -I "$RUNNER_TEMP/securecode/scripts/secgate.py" . --mode ci --fail-on high --run-tests
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appsec-findings
          path: .security/
