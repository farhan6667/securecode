name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tags can be rewritten).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies (pinned)
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2" "PyYAML==6.0.3"
      - name: Run tests
        run: python -m pytest -q tests -p no:cacheprovider
  selfscan:
    # The package's own gate on its own code, with the same pinned scanners the CI templates use.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned scanners
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          bash scripts/install-ci-scanners.sh
      - name: Gate on this repository (ci mode, fails closed)
        # In this repo the suppression list is the maintainer-reviewed one (CODEOWNERS), so ci mode may use it.
        env:
          SECGATE_SUPPRESSIONS: config/security-suppressions.yaml
        run: python -I scripts/secgate.py . --mode ci --fail-on high
      - name: Benchmark lab (full mode)
        run: python -I benchmark/run_lab.py --mode full
